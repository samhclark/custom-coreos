# ABOUTME: Declarative config for the rootless VictoriaMetrics Quadlet;
# consumed by generate-quadlets.py (build time) and
# sops-distribute-secrets.sh (boot time).

[service]
name = "victoria-metrics"
description = "VictoriaMetrics Time Series Database"
documentation = "https://docs.victoriametrics.com/"

[host]
username = "_nas_victoriametrics"
uid = 51250
subid-start = 512500000
display-name = "VictoriaMetrics"

[container]
image = "docker.io/victoriametrics/victoria-metrics:v1.149.0@sha256:13b8951e35bb3589626816538483127785a9d8b53f9f5123769db0fcab1d961f"
network = "host"
container-user = 0
exec = "-storageDataPath=/victoria-metrics-data -retentionPeriod=1 -promscrape.config=/etc/victoria-metrics/promscrape.yml -httpListenAddr=0.0.0.0:8428"

[krun]
enabled = true
cpus = 2
ram-mib = 1024
network = "tap"
ipv4 = "10.253.7.2/30"
probe-port = 8428
host-access = [9100]

[[krun.ingress]]
from = "caddy"
ports = [8428]

[[krun.ingress]]
from = "grafana"
ports = [8428]

[[krun.ingress]]
from = "vmalert"
ports = [8428]

[[container.ports]]
host = "127.0.0.1:8428"
container = 8428

[[container.volumes]]
comment = "Image-controlled scrape configuration (read-only)"
source = "/usr/share/custom-coreos/victoria-metrics/promscrape.yml"
target = "/etc/victoria-metrics/promscrape.yml"
options = "ro"

[[container.volumes]]
comment = "Persistent ZFS storage; ownership and SELinux labels are prepared by the host unit"
source = "/var/lib/victoria-metrics"
target = "/victoria-metrics-data"

[[container.secrets]]
name = "garage-metrics-token"

[assets]
path = "/usr/share/custom-coreos/victoria-metrics"

[unit]
timeout-start-sec = 900

[startup.readiness]
marker = "/run/victoria-metrics-dataset/ready"
timeout-sec = 300
interval-sec = 2

[[startup.readiness.paths]]
path = "/var/lib/victoria-metrics"
mount-source = "tank/victoria-metrics/data"
owner = "service"
access = ["write"]
