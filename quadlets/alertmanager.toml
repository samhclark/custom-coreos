# ABOUTME: Declarative config for the rootless Alertmanager quadlet; consumed by
# generate-quadlets.py (build time) and sops-distribute-secrets.sh (boot time).

[service]
name = "alertmanager"
application = "observability"
role = "alertmanager"
description = "Prometheus Alertmanager"
documentation = "https://prometheus.io/docs/alerting/latest/alertmanager/"

[host]
username = "_nas_alertmanager"
uid = 51240
subid-start = 512400000
display-name = "Alertmanager"

[container]
image = "docker.io/prom/alertmanager:v0.33.1@sha256:9e082985f56f4c8c9f724e18f2288c6708f472e56a5286b8863d080434ea065d"
network = "host"
# Avoid the host's loopback-only systemd-resolved stub inside the krun guest.
# MagicDNS preserves tailnet resolution; Comcast resolvers provide fallbacks.
dns = ["100.100.100.100", "75.75.75.75", "75.75.76.76"]
container-user = 0
exec = "--web.listen-address=0.0.0.0:9093 --config.file=/etc/alertmanager/alertmanager.yml --storage.path=/alertmanager --cluster.listen-address="

[krun]
enabled = true
cpus = 1
ram-mib = 256
network = "tap"
ipv4 = "10.253.6.2/30"
probe-endpoint = "http"

[[container.endpoints]]
name = "http"
port = 9093
host = "127.0.0.1:9093"
consumers = ["vmalert", "victoria-metrics"]

[[container.volumes]]
comment = "Image-controlled configuration (read-only)"
source = "/usr/share/custom-coreos/alertmanager/alertmanager.yml"
target = "/etc/alertmanager/alertmanager.yml"
options = "ro"

[[container.secrets]]
name = "pushover-user-key"

[[container.secrets]]
name = "pushover-api-token"

[assets]
path = "/usr/share/custom-coreos/alertmanager"

[[storage]]
name = "state"
kind = "directory"
host-path = "/var/lib/alertmanager"
mode = "0750"
subdirectories = ["data"]

[[storage.exports]]
subpath = "data"
container-path = "/alertmanager"
access = "read-write"
