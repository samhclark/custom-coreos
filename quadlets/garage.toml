# ABOUTME: Declarative config for the rootless Garage Quadlet; consumed by
# generate-quadlets.py (build time) and sops-distribute-secrets.sh (boot time).

[service]
name = "garage"
description = "Garage S3-compatible Object Storage"
documentation = "https://garagehq.deuxfleurs.fr/"

[host]
username = "_nas_garage"
uid = 51110
subid-start = 511100000
display-name = "Garage"

[container]
image = "docker.io/dxflrs/garage:v2.3.0@sha256:866bd13ed2038ba7e7190e840482bc27234c4afaf77be8cfa439ae088c1e4690"
network = "host"
container-user = 0

[krun]
enabled = true
cpus = 2
ram-mib = 1024
network = "tap"
ipv4 = "10.253.1.2/30"
probe-port = 3900

[[krun.ingress]]
from = "caddy"
ports = [3900, 3903]

[[krun.ingress]]
from = "victoria-metrics"
ports = [3903]

[[krun.ingress]]
from = "blackbox-exporter"
ports = [3903]

[[container.volumes]]
comment = "Image-controlled configuration (read-only)"
source = "/usr/share/custom-coreos/garage/garage.toml"
target = "/etc/garage.toml"
options = "ro"

[[container.secrets]]
name = "garage-rpc-secret"

[[container.secrets]]
name = "garage-admin-token"

[[container.secrets]]
name = "garage-metrics-token"

[[container.ports]]
host = "127.0.0.1:3900"
container = 3900

[[container.ports]]
host = "127.0.0.1:3902"
container = 3902

[[container.ports]]
host = "127.0.0.1:3903"
container = 3903

[assets]
path = "/usr/share/custom-coreos/garage"

[[storage]]
name = "meta"
kind = "managed-zfs"
dataset = "tank/garage/meta"
host-path = "/var/lib/garage/meta"
mode = "0750"
record-size = "4K"
compression = "lz4"
atime = false
primary-cache = "metadata"

[[storage.exports]]
subpath = "."
container-path = "/var/lib/garage/meta"
access = "read-write"

[[storage]]
name = "data"
kind = "managed-zfs"
dataset = "tank/garage/data"
host-path = "/var/lib/garage/data"
mode = "0750"
record-size = "1M"
compression = "off"
atime = false
primary-cache = "all"

[[storage.exports]]
subpath = "."
container-path = "/var/lib/garage/data"
access = "read-write"

[unit]
timeout-start-sec = 4200

[startup]
require-published-tcp-ports-free = true
