# ABOUTME: Declarative config for the rootless vmalert quadlet; consumed by
# generate-quadlets.py (build time) and sops-distribute-secrets.sh (boot time).

[service]
name = "vmalert"
description = "VictoriaMetrics vmalert - Alerting Rules Evaluator"
documentation = "https://docs.victoriametrics.com/vmalert/"

[host]
username = "_nas_vmalert"
uid = 51220
subid-start = 512200000
display-name = "vmalert"

[container]
image = "docker.io/victoriametrics/vmalert:v1.149.0@sha256:1a134a67005efd1891d9abb50ddeacfe08f0c8d2f5fb6ae9b7fc91268bdbe59b"
network = "host"
exec = "-datasource.url=http://victoria-metrics.krun:8428 -remoteWrite.url=http://victoria-metrics.krun:8428 -remoteRead.url=http://victoria-metrics.krun:8428 -notifier.url=http://alertmanager.krun:9093 -rule=/etc/vmalert/alert-rules.yml -httpListenAddr=0.0.0.0:8880"

[krun]
enabled = true
cpus = 1
ram-mib = 256
network = "tap"
ipv4 = "10.253.4.2/30"
probe-port = 8880

[[krun.ingress]]
from = "victoria-metrics"
ports = [8880]

[[container.ports]]
host = "127.0.0.1:8880"
container = 8880

[[container.volumes]]
comment = "Image-controlled alerting rules (read-only)"
source = "/usr/share/custom-coreos/vmalert"
target = "/etc/vmalert"
options = "ro"

[assets]
path = "/usr/share/custom-coreos/vmalert"

[unit]
timeout-start-sec = 330

[startup.readiness]
url = "http://127.0.0.1:8428/-/healthy"
timeout-sec = 300
interval-sec = 2
