# ABOUTME: Production PostgreSQL/VectorChord database for Immich.

[service]
name = "immich-database"
application = "immich"
role = "database"
description = "Immich PostgreSQL Database"
documentation = "https://docs.immich.app/install/docker-compose/"

[host]
username = "_nas_immichdatabase"
uid = 51140
subid-start = 511400000
display-name = "Immich database"

[container]
image = "ghcr.io/immich-app/postgres:14-vectorchord0.5.3-pgvector0.8.1@sha256:89817026d570de0dd4fdd29486a417bcdff31ce4010f8ddc8e8790f42eca710f"
network = "host"
container-user = 1000
entrypoint = "/usr/share/custom-coreos/immich-database/immich-database-entrypoint.sh"
exec = "postgres -c config_file=/etc/postgresql/postgresql.conf"
no-new-privileges = true
drop-capabilities = ["NET_RAW"]
shm-size-mib = 128

[container.environment]
POSTGRES_PASSWORD_FILE = "/run/secrets/immich-db-password"
POSTGRES_USER = "postgres"
POSTGRES_DB = "immich"
POSTGRES_INITDB_ARGS = "--data-checksums"
DB_STORAGE_TYPE = "HDD"

[[container.volumes]]
comment = "Image-controlled PostgreSQL entrypoint adapter (read-only)"
source = "/usr/share/custom-coreos/immich-database"
target = "/usr/share/custom-coreos/immich-database"
options = "ro"

[krun]
enabled = true
cpus = 2
ram-mib = 2048
network = "tap"
ipv4 = "10.253.11.2/30"
probe-endpoint = "postgres"
probe-timeout-sec = 120

[[container.secrets]]
name = "immich-db-password"

[assets]
path = "/usr/share/custom-coreos/immich-database"

[[container.endpoints]]
name = "postgres"
port = 5432
consumers = ["immich-server"]

[[storage]]
name = "data"
kind = "managed-zfs"
dataset = "tank/immich-database/data"
host-path = "/var/lib/immich/database"
mode = "0700"
record-size = "32K"
compression = "lz4"
atime = false
primary-cache = "all"

[[storage.exports]]
subpath = "."
container-path = "/var/lib/postgresql/data"
access = "read-write"

[unit]
timeout-start-sec = 900
