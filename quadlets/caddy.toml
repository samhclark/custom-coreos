# ABOUTME: Declarative config for the rootless Caddy Quadlet, including its
# persistent state lifecycle and container exports.

[service]
name = "caddy"
description = "Caddy Reverse Proxy"
documentation = "https://caddyserver.com/docs/"

[host]
username = "_nas_caddy"
uid = 51310
subid-start = 513100000
display-name = "Caddy"

[container]
image = "ghcr.io/samhclark/lab-caddy:2.11.4-cf-0.2.4@sha256:fc548596b7bbc0ec5aa82a495e74652cecb4602fad3bb63b2d707ca4e6e1e555"
network = "host"
# Avoid the host's loopback-only systemd-resolved stub inside the nested guest.
# MagicDNS preserves tailnet resolution; Comcast resolvers provide fallbacks
# for ACME and Cloudflare DNS API access.
dns = ["100.100.100.100", "75.75.75.75", "75.75.76.76"]
container-user = 0

[krun]
enabled = true
cpus = 2
ram-mib = 512
network = "tap"
ipv4 = "10.253.9.2/30"
probe-port = 80

[[krun.ingress]]
from = "victoria-metrics"
ports = [2019]

[[container.ports]]
host = "0.0.0.0:80"
container = 80

[[container.ports]]
host = "0.0.0.0:443"
container = 443

[[container.ports]]
host = "0.0.0.0:443"
container = 443
protocol = "udp"

[[container.ports]]
host = "127.0.0.1:2019"
container = 2019

[[container.volumes]]
comment = "Image-controlled configuration (read-only)"
source = "/usr/share/custom-coreos/caddy/Caddyfile"
target = "/etc/caddy/Caddyfile"
options = "ro"

[[container.secrets]]
name = "cf-api-token"

[assets]
path = "/usr/share/custom-coreos/caddy"

[[storage]]
name = "data"
kind = "directory"
host-path = "/var/lib/caddy"
mode = "0750"

[[storage.exports]]
subpath = "."
container-path = "/data"
access = "read-write"

[[storage]]
name = "config"
kind = "directory"
host-path = "/var/lib/caddy-config"
mode = "0750"

[[storage.exports]]
subpath = "."
container-path = "/config"
access = "read-write"

[unit]
timeout-start-sec = 330
