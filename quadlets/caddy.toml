# ABOUTME: Declarative config for the rootless Caddy Quadlet; persistent state
# is verified each boot by prepare-caddy-state.service.

[service]
name = "caddy"
description = "Caddy Reverse Proxy"
documentation = "https://caddyserver.com/docs/"

[host]
username = "_nas_caddy"
uid = 51310
subid-start = 513100000
display-name = "Caddy"

[container]
image = "ghcr.io/samhclark/lab-caddy:2.11.4-cf-0.2.4@sha256:78331c4abc23f4f3f39675745af20b06d9aae97ae244772414e7933c8c1ab054"
network = "host"
# Avoid the host's loopback-only systemd-resolved stub inside the nested guest.
# MagicDNS preserves tailnet resolution; Comcast resolvers provide fallbacks
# for ACME and Cloudflare DNS API access.
dns = ["100.100.100.100", "75.75.75.75", "75.75.76.76"]
container-user = 0

[krun]
enabled = true
cpus = 2
ram-mib = 512
network = "tap"
ipv4 = "10.253.9.2/30"
probe-port = 80

[[krun.ingress]]
from = "victoria-metrics"
ports = [2019]

[[container.ports]]
host = "0.0.0.0:80"
container = 80

[[container.ports]]
host = "0.0.0.0:443"
container = 443

[[container.ports]]
host = "0.0.0.0:443"
container = 443
protocol = "udp"

[[container.ports]]
host = "127.0.0.1:2019"
container = 2019

[[container.volumes]]
comment = "Image-controlled configuration (read-only)"
source = "/usr/share/custom-coreos/caddy/Caddyfile"
target = "/etc/caddy/Caddyfile"
options = "ro"

[[container.volumes]]
comment = "Persistent certificate and ACME state; ownership and SELinux labels are prepared by the host unit"
source = "/var/lib/caddy"
target = "/data"

[[container.volumes]]
comment = "Persistent Caddy runtime configuration state; ownership and SELinux labels are prepared by the host unit"
source = "/var/lib/caddy-config"
target = "/config"

[[container.secrets]]
name = "cf-api-token"

[assets]
path = "/usr/share/custom-coreos/caddy"

[unit]
timeout-start-sec = 330

[startup.readiness]
marker = "/run/caddy-state/ready"
timeout-sec = 300
interval-sec = 2

[[startup.readiness.paths]]
path = "/var/lib/caddy"
access = ["write"]

[[startup.readiness.paths]]
path = "/var/lib/caddy-config"
access = ["write"]
