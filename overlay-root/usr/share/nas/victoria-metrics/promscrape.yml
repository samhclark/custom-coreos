global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'victoriametrics'
    static_configs:
      - targets: ['127.0.0.1:8428']

  - job_name: 'victoria-logs'
    static_configs:
      - targets: ['victoria-logs.krun:9428']

  - job_name: 'garage'
    # Garage's admin/metrics endpoint can respond slowly under load.
    # Give it a longer timeout and a less aggressive scrape cadence.
    scrape_interval: 1m
    scrape_timeout: 30s
    bearer_token_file: /run/secrets/garage-metrics-token
    static_configs:
      - targets: ['garage.krun:3903']

  - job_name: 'garage-health'
    # Garage's /health endpoint is fast and is the authoritative availability
    # signal. Probe it via blackbox_exporter rather than inferring health from
    # the slow on-demand /metrics endpoint.
    metrics_path: /probe
    scrape_interval: 1m
    scrape_timeout: 10s
    params:
      module: ['http_2xx']
    static_configs:
      - targets: ['http://garage.krun:3903/health']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: service
        replacement: garage
      - target_label: __address__
        replacement: blackbox-exporter.krun:9115

  - job_name: 'jellyfin-health'
    metrics_path: /probe
    scrape_interval: 1m
    scrape_timeout: 10s
    params:
      module: ['http_2xx']
    static_configs:
      - targets: ['http://jellyfin.krun:8096/health']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: service
        replacement: jellyfin
      - target_label: __address__
        replacement: blackbox-exporter.krun:9115

  - job_name: 'immich-health'
    metrics_path: /probe
    scrape_interval: 1m
    scrape_timeout: 10s
    params:
      module: ['http_2xx']
    static_configs:
      - targets: ['http://immich-server.krun:2283/api/server/ping']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: service
        replacement: immich
      - target_label: __address__
        replacement: blackbox-exporter.krun:9115

  - job_name: 'jellyfin-exporter'
    # Polls Jellyfin's authenticated Sessions API through the local exporter.
    # A 15-second cadence keeps the phone-visible dashboard responsive without
    # turning playback titles into an unnecessarily dense time series.
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ['jellyfin-exporter.krun:9594']

  - job_name: 'caddy'
    static_configs:
      - targets: ['caddy.krun:2019']

  - job_name: 'node'
    static_configs:
      - targets: ['host.krun.internal:9100']

  - job_name: 'vmalert'
    static_configs:
      - targets: ['vmalert.krun:8880']

  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager.krun:9093']

  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana.krun:3000']
