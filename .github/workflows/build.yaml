name: Build Custom CoreOS

on:
  workflow_dispatch:
  schedule:
    - cron: '18 9 * * *'  # Daily at 9:18 AM UTC

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: custom-coreos-publisher
  cancel-in-progress: false

jobs:
  preflight:
    uses: ./.github/workflows/build-preflight.yaml
    permissions:
      contents: read
      packages: read

  build:
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Remove fuse-overlayfs
        run: |
          while p=$(command -v fuse-overlayfs 2>/dev/null); do sudo rm -f "$p"; done

      - name: Build container image
        id: build
        uses: redhat-actions/buildah-build@3a51aade9afa17e5c78256bcbe2e1ee08c7b995b # v3.0.2
        with:
          image: ${{ env.IMAGE_NAME }}
          tags: stable
          containerfiles: |
            ./Containerfile
          build-args: |
            ZFS_VERSION=${{ needs.preflight.outputs.zfs-version }}
            KERNEL_VERSION=${{ needs.preflight.outputs.kernel-version }}

      - name: Verify exact built image contract
        run: make verify-image IMAGE_NAME="${IMAGE_NAME}" TAG=stable

      - name: Log in to Container Registry
        uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 # v2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to registry
        id: push
        uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37 # v3.0.0
        with:
          image: ${{ steps.build.outputs.image }}
          tags: ${{ steps.build.outputs.tags }}
          registry: ${{ env.REGISTRY }}

      - name: Generate artifact attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Sign the published OCI image
        uses: samhclark/cosign-exec-action@f8a4f58b424b15fa5fee1795fd25e6de48f9609d # v1.1.0
        env:
          COSIGN_PASSWORD: ${{ secrets.cosign_password }}
          COSIGN_PRIVATE_KEY: ${{ secrets.cosign_private_key }}
        with:
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          args: >-
            sign --yes --key=env://COSIGN_PRIVATE_KEY --new-bundle-format=false --use-signing-config=false 
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
