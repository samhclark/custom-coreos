name: Build Custom CoreOS

on:
  workflow_dispatch:
  schedule:
    - cron: '18 9 * * *'  # Daily at 9:18 AM UTC

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify-sops-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve SOPS image from Containerfile
        id: sops-image
        run: |
          SOPS_IMAGE="$(awk '$1 == "FROM" && $2 ~ /^ghcr.io\/getsops\/sops:/ { print $2; exit }' Containerfile)"
          if [[ -z "${SOPS_IMAGE}" ]]; then
            echo "Failed to find SOPS image in Containerfile" >&2
            exit 1
          fi
          echo "image=${SOPS_IMAGE}" >> "${GITHUB_OUTPUT}"
          echo "Verifying ${SOPS_IMAGE}"

      - name: Verify SOPS image signature
        uses: samhclark/cosign-exec-action@f8a4f58b424b15fa5fee1795fd25e6de48f9609d # v1.1.0
        with:
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          args: >-
            verify ${{ steps.sops-image.outputs.image }}
            --certificate-identity-regexp=https://github.com/getsops
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com
            -o text

  query-versions:
    runs-on: ubuntu-latest
    outputs:
      kernel-version: ${{ steps.build-inputs.outputs.kernel-version }}
      zfs-version: ${{ steps.build-inputs.outputs.zfs-version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve and verify build inputs
        id: build-inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/resolve-build-inputs.sh --github-output "${GITHUB_OUTPUT}"

  build:
    needs:
      - query-versions
      - verify-sops-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build container image
        id: build
        uses: redhat-actions/buildah-build@3a51aade9afa17e5c78256bcbe2e1ee08c7b995b # v3.0.2
        with:
          image: ${{ env.IMAGE_NAME }}
          tags: stable
          containerfiles: |
            ./Containerfile
          build-args: |
            ZFS_VERSION=${{ needs.query-versions.outputs.zfs-version }}
            KERNEL_VERSION=${{ needs.query-versions.outputs.kernel-version }}

      - name: Log in to Container Registry
        uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 # v2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to registry
        id: push
        uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37 # v3.0.0
        with:
          image: ${{ steps.build.outputs.image }}
          tags: ${{ steps.build.outputs.tags }}
          registry: ${{ env.REGISTRY }}

      - name: Generate artifact attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Sign the published OCI image
        if: ${{ github.event_name != 'pull_request' }}
        uses: samhclark/cosign-exec-action@f8a4f58b424b15fa5fee1795fd25e6de48f9609d # v1.1.0
        env:
          COSIGN_PASSWORD: ${{ secrets.cosign_password }}
          COSIGN_PRIVATE_KEY: ${{ secrets.cosign_private_key }}
        with:
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          args: >-
            sign --yes --key=env://COSIGN_PRIVATE_KEY --new-bundle-format=false --use-signing-config=false 
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
