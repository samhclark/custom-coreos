# ABOUTME: CI workflow to validate container builds on PRs and pushes to main
# Does not push to registry or sign - just validates the build succeeds

name: Build Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  IMAGE_NAME: ${{ github.repository }}

jobs:
  preflight:
    uses: ./.github/workflows/build-preflight.yaml
    permissions:
      contents: read
      packages: read

  build:
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build container image
        uses: redhat-actions/buildah-build@3a51aade9afa17e5c78256bcbe2e1ee08c7b995b # v3.0.2
        with:
          image: ${{ env.IMAGE_NAME }}
          tags: ci-check
          containerfiles: |
            ./Containerfile
          build-args: |
            ZFS_VERSION=${{ needs.preflight.outputs.zfs-version }}
            KERNEL_VERSION=${{ needs.preflight.outputs.kernel-version }}
