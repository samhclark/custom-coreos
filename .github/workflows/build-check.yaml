# ABOUTME: CI workflow to validate container builds on PRs and pushes to main
# Does not push to registry or sign - just validates the build succeeds

name: Build Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify-sops-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve SOPS image from Containerfile
        id: sops-image
        run: |
          SOPS_IMAGE="$(awk '$1 == "FROM" && $2 ~ /^ghcr.io\/getsops\/sops:/ { print $2; exit }' Containerfile)"
          if [[ -z "${SOPS_IMAGE}" ]]; then
            echo "Failed to find SOPS image in Containerfile" >&2
            exit 1
          fi
          echo "image=${SOPS_IMAGE}" >> "${GITHUB_OUTPUT}"
          echo "Verifying ${SOPS_IMAGE}"

      - name: Verify SOPS image signature
        uses: samhclark/cosign-exec-action@f8a4f58b424b15fa5fee1795fd25e6de48f9609d # v1.1.0
        with:
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          args: >-
            verify ${{ steps.sops-image.outputs.image }}
            --certificate-identity-regexp=https://github.com/getsops
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com
            -o text

  verify-generated:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install development dependencies
        run: python3 -m pip install --requirement requirements-dev.txt

      - name: Validate repository and generated artifacts
        run: make verify-generated

  query-versions:
    runs-on: ubuntu-latest
    outputs:
      kernel-version: ${{ steps.build-inputs.outputs.kernel-version }}
      zfs-version: ${{ steps.build-inputs.outputs.zfs-version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve and verify build inputs
        id: build-inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/resolve-build-inputs.sh --github-output "${GITHUB_OUTPUT}"

  build:
    needs:
      - query-versions
      - verify-sops-image
      - verify-generated
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build container image
        uses: redhat-actions/buildah-build@3a51aade9afa17e5c78256bcbe2e1ee08c7b995b # v3.0.2
        with:
          image: ${{ env.IMAGE_NAME }}
          tags: ci-check
          containerfiles: |
            ./Containerfile
          build-args: |
            ZFS_VERSION=${{ needs.query-versions.outputs.zfs-version }}
            KERNEL_VERSION=${{ needs.query-versions.outputs.kernel-version }}
